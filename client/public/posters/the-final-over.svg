<rect width="400" height="600" fill="url(#bg)"/>
<ellipse cx="200" cy="420" rx="230" ry="70" fill="#ffffff" fill-opacity=".2"/><rect x="185" y="240" width="8" height="140" fill="#ffffff"/><rect x="200" y="240" width="8" height="140" fill="#ffffff"/><rect x="215" y="240" width="8" height="140" fill="#ffffff"/><circle cx="300" cy="170" r="16" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
